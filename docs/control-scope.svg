<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">CNCF security controls by scope and assessment</title>
  <desc id="d">Of 214 catalog controls, 159 are out of scope and 55 are in scope. Of the 55 in scope, 20 are checked by Privateer native, 5 by the Privateer plugin, and 30 are not checked.</desc>
  <rect width="760" height="260" fill="#ffffff"/>

  <text x="20" y="26" font-size="16" font-weight="600" fill="#1f2328">214 CNCF security controls</text>

  <!-- Row 1: scope (scale 720 / 214 px per control) -->
  <rect x="20" y="40" width="535" height="44" fill="#6e7781"/>
  <rect x="555" y="40" width="185" height="44" fill="#3b82d4"/>
  <text x="287.5" y="68" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Out of scope: 159</text>
  <text x="647.5" y="68" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">In scope: 55</text>

  <!-- Expansion of the in-scope controls -->
  <polygon points="555,84 740,84 740,144 20,144" fill="#dbe9f7"/>

  <!-- Row 2: how the 55 in-scope controls are assessed (scale 720 / 55 px per control) -->
  <rect x="20" y="144" width="262" height="44" fill="#4a7c59"/>
  <rect x="282" y="144" width="65" height="44" fill="#7c5cd8"/>
  <rect x="347" y="144" width="393" height="44" fill="#a86a00"/>
  <text x="151" y="173" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">20</text>
  <text x="314.5" y="173" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
  <text x="543.5" y="173" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">30</text>

  <text x="151" y="210" font-size="14" fill="#1f2328" text-anchor="middle">Privateer native</text>
  <text x="151" y="228" font-size="14" fill="#1f2328" text-anchor="middle">checked</text>
  <text x="314.5" y="210" font-size="14" fill="#1f2328" text-anchor="middle">Privateer plugin</text>
  <text x="314.5" y="228" font-size="14" fill="#1f2328" text-anchor="middle">checked</text>
  <text x="543.5" y="210" font-size="14" fill="#1f2328" text-anchor="middle">Not checked</text>
</svg>
