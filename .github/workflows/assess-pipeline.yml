name: Assessment pipeline

# Reusable pipeline, called by assess-all.yml (all levels) and by
# assess-graduated.yml, assess-incubating.yml and assess-sandbox.yml.
#
# Do not set `concurrency` here. The four caller workflows share one group so
# that they never run at the same time; setting the same group in the called
# workflow as well would make the run wait on itself.

on:
  workflow_call:
    inputs:
      maturities:
        description: 'JSON array of maturity levels to assess, e.g. ["graduated"]'
        type: string
        required: true

permissions:
  contents: read

# Two stages:
#   prepare  refresh the landscape metadata and build the shared base once, then
#            commit and push it, so every assessment starts from the same base.
#   assess   one job per requested maturity level, run one after another. Each
#            project's result is committed and pushed as soon as it is done
#            (ASSESS_PUSH=1), so the repository and README are always current and
#            a job that is cancelled or times out loses at most one project.
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download landscape metadata and regenerate README
        run: python3 scripts/update_readme.py

      - name: Build base OSCAL artifacts
        run: python3 scripts/build_project_compliance.py base

      - name: Commit and push the refreshed data
        run: |
          git add README.md data/projects.json reports/ trestle.ws/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh CNCF landscape data and base OSCAL artifacts"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  assess:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1   # levels run one after another, never at the same time
      matrix:
        maturity: ${{ fromJSON(inputs.maturities) }}
    env:
      MATURITY: ${{ matrix.maturity }}
    steps:
      # The branch tip, not the commit the run started from: it includes what
      # prepare and any earlier level pushed.
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: privateer-plugins/cncf-controls/go.mod

      - name: Install Privateer
        run: scripts/privateer/install.sh

      - name: Assess projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSESS_PUSH: "1"
        run: python3 scripts/assess_maturity.py "$MATURITY"
