name: Assess all projects

# Assess all maturity levels and regenerate the README. Manual trigger only.
# To run it daily again, add under `on:`:
#   schedule:
#     - cron: "0 3 * * *"   # 03:00 UTC; scheduled runs use the default branch
# All four assessment workflows share the "cncf-assessment" concurrency group,
# so they never run at the same time. GitHub keeps one running and one pending
# run per group; a newer pending run replaces an older pending one.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cncf-assessment
  cancel-in-progress: false

jobs:
  pipeline:
    uses: ./.github/workflows/assess-pipeline.yml
    with:
      maturities: '["graduated","incubating","sandbox"]'
