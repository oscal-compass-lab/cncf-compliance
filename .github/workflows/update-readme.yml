jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: privateer-plugins/cncf-controls/go.mod

      - name: Install Privateer
        run: scripts/privateer/install.sh

      - name: Download landscape metadata and regenerate README
        run: python3 scripts/update_readme.py

      - name: Build base OSCAL artifacts
        run: python3 scripts/build_project_compliance.py base

      - name: Assess projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exempt=$(echo "$ASSESSMENT_EXEMPT" | tr '\n' ' ')
          python3 - <<'EOF'
          import json, os, subprocess, sys
          exempt = set(u.strip().rstrip('/') for u in os.environ['ASSESSMENT_EXEMPT'].splitlines() if u.strip())
          projects = json.loads(open('data/projects.json').read())
          to_assess = [p['repo_url'] for p in projects if p.get('repo_url', '').rstrip('/') not in exempt]
          print(f"Assessing {len(to_assess)} project(s), skipping {len(projects) - len(to_assess)}.")
          failed = []
          for url in to_assess:
              print(f"\n=== {url} ===", flush=True)
              r = subprocess.run(
                  [sys.executable, 'scripts/build_project_compliance.py', 'project', url],
                  check=False,
              )
              if r.returncode != 0:
                  print(f"WARNING: build_project_compliance.py failed for {url}", flush=True)
                  failed.append(url)
                  continue
              r = subprocess.run(
                  [sys.executable, 'scripts/assess_project.py', url],
                  check=False,
              )
              if r.returncode != 0:
                  print(f"WARNING: assess_project.py failed for {url}", flush=True)
                  failed.append(url)
          if failed:
              print(f"\nFailed assessments ({len(failed)}):")
              for u in failed:
                  print(f"  {u}")
          EOF

      - name: Commit and push changes
        run: |
          git add README.md data/projects.json reports/ trestle.ws/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update CNCF project assessments and README tables"
          git push
